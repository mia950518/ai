# nginx.conf
# 這是 Nginx 的伺服器設定檔範本 (Server Block)
# 正式部署時請將此檔案內容複製或連結至 Nginx 的 sites-available/ 目錄下

# 1. HTTP 伺服器：負責將所有 HTTP 流量 (Port 80) 自動導向至加密的 HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    
    # 請替換為您的網域或公網 IP (例如: bot.example.com)
    server_name yourdomain.com www.yourdomain.com;

    # 讓 Let's Encrypt Certbot 進行驗證的目錄
    location ~/.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # HTTP 301 永久重新導向至 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 伺服器：處理加密的安全連線 (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name yourdomain.com www.yourdomain.com;

    # --- SSL 憑證路徑設定 (Let's Encrypt / Certbot 申請成功後會產生於此路徑) ---
    # 請將 "yourdomain.com" 替換為您申請的實際網域名稱
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # --- SSL 安全性最佳實踐設定 ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # 啟用 HSTS 強制安全瀏覽 (建議選用)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # --- 靜態檔案快取優化 (由 Nginx 直接分發，不透過後端 Flask/Gunicorn，極大提升速度) ---
    location /static/ {
        # 請設定為您伺服器上專案 static 目錄的絕對路徑
        alias /home/ubuntu/cloud-project/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --- 動態請求轉發 (Reverse Proxy to Gunicorn) ---
    location / {
        # 轉發至本地運作的 Gunicorn 伺服器 (Port 5002)
        proxy_pass http://127.0.0.1:5002;
        
        # 傳遞用戶端真實的連線資訊給後端 Flask
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支援長連線與快取
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 設定超時時間
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
        proxy_buffer_size 4k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;
    }
}
